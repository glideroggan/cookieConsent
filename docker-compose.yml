services:  # Cookie Consent API
  api:
    image: docker.io/glideroggan/cookie-consent-api:latest
    build:
      context: ./api
      dockerfile: dockerfile
    container_name: cookie-consent-api
    ports:
      - "5220:5220"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5220
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/consent.db
      # Required, no default: at least 32 random characters (openssl rand -hex 32), set in .env (mode 600).
      # The API refuses to start without a usable key. Admin CORS origins come from appsettings.json.
      - AdminApiKey=${ADMIN_API_KEY:?ADMIN_API_KEY must be set in .env}
    # The app runs as uid 1654 (USER $APP_UID in the image); the host data/ folder must be owned by it:
    # chown -R 1654:1654 data
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Web Component + Admin Panel Server (nginx)
  web:
    build:
      context: .  # Build from root to access demo/ folder
      dockerfile: ./web/dockerfile
    container_name: cookie-consent-web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
